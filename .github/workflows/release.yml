name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build Release (Unsigned)
        run: dotnet publish SWGSurvivors-Patcher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./publish

      - name: Sign with SignPath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: 'SWGSurvivorsLauncher'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'default'
          input-artifact-path: ./publish/SWGSurvivors-Patcher.exe
          output-artifact-path: ./publish/SWGSurvivors-Patcher-signed.exe
          wait-for-completion: true

      - name: Rename signed executable
        run: |
          Remove-Item ./publish/SWGSurvivors-Patcher.exe -Force
          Rename-Item ./publish/SWGSurvivors-Patcher-signed.exe SWGSurvivors-Patcher.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./publish/SWGSurvivors-Patcher.exe
          generate_release_notes: true
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
